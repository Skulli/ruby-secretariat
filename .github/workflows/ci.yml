name: Tests

on:
  pull_request:
    branches:
      # '**' und nicht '*': Der Filter gilt dem ZIEL-Branch, nicht dem Branch,
      # von dem der Pull Request kommt -- und der einfache Stern matcht keinen
      # Schraegstrich. Ein gestapelter Pull Request, der auf einen Branch wie
      # claude/basis zeigt statt auf main, bekam damit gar keine Pruefung, und
      # zwar lautlos: es gab keine rote Pruefung, es gab ueberhaupt keine.
      - '**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: default
          bundler-cache: true

      - name: Standardrb Check
        run: bundle exec standardrb

      - name: Run tests
        # SimpleCov laeuft nur mit COVERAGE=1 -- ohne das hier greift auch die
        # Untergrenze aus spec_helper.rb nicht, und ein Absturz der Abdeckung
        # liefe still durch.
        env:
          COVERAGE: 1
        run: |
          bundle exec rspec

# Uncomment to run system tests in CI
#          bin/rails test:system
